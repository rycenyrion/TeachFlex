name: Build and Release TeachFlex

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout TeachFlex
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Restore dependencies
        shell: pwsh
        run: >
          msbuild TeachFlex.csproj
          /t:Restore
          /p:Configuration=Release
          /p:RuntimeIdentifier=win-x64

      - name: Publish TeachFlex
        shell: pwsh
        run: >
          msbuild TeachFlex.csproj
          /t:Publish
          /p:Configuration=Release
          /p:RuntimeIdentifier=win-x64
          /p:SelfContained=true
          /p:PublishSingleFile=true
          /p:IncludeNativeLibrariesForSelfExtract=true
          /p:PublishDir="$env:GITHUB_WORKSPACE\publish\"

      - name: Create ZIP package
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME

          if ([string]::IsNullOrWhiteSpace($version)) {
            $version = "test"
          }

          $zipName = "TeachFlex-$version-win-x64.zip"

          Compress-Archive `
            -Path "publish\*" `
            -DestinationPath $zipName `
            -Force

          "PACKAGE_NAME=$zipName" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Append

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" "$env:PACKAGE_NAME" `
            --repo "$env:GITHUB_REPOSITORY" `
            --title "TeachFlex $env:GITHUB_REF_NAME" `
            --generate-notes
